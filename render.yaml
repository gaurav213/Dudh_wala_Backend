services:
  - type: web
    name: doodh-khata-api
    runtime: node
    plan: starter
    buildCommand: npm ci --registry=https://registry.npmjs.org && npm run build
    startCommand: npm run migration:run && npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: API_PREFIX
        value: api
      - key: API_VERSION
        value: 1
      - key: DATABASE_URL
        fromDatabase:
          name: doodh-khata-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: BCRYPT_ROUNDS
        value: 12
      - key: CORS_ORIGINS
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: info

databases:
  - name: doodh-khata-db
    plan: starter
    databaseName: doodh_khata
    user: doodh_khata
